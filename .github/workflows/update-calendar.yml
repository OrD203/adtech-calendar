name: Auto-Discover and Update Calendar Events

on:
  schedule:
    # Runs every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests lxml gspread oauth2client
      
      - name: Discover new events from web
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: |
          python scripts/discover_events.py
      
      - name: Merge with existing events
        run: |
          python scripts/merge_events.py
      
      - name: Fetch events from Google Sheets (if configured)
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -n "$GOOGLE_SHEETS_CREDENTIALS" ] && [ -n "$SHEET_ID" ]; then
            python scripts/fetch_events.py || echo "Google Sheets not configured, skipping"
          else
            echo "Google Sheets not configured, using discovered events only"
          fi
      
      - name: Update calendar HTML
        run: |
          python scripts/update_calendar.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html data/
          git commit -m "🤖 Auto-update: Discovered new events and synced calendar"
          git push
      
      - name: Report status
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "✅ Calendar updated with new events!"
          if [ -f data/discovered_events.json ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('data/discovered_events.json'))))")
            echo "📊 Discovered $COUNT new events"
          fi
      
      - name: No changes
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "ℹ️ No changes detected - calendar is up to date"
